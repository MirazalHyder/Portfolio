<p class="in" style="animation-delay:.2s">Creating is how I understand the world. I take an idea out of my head, give it a real frame, and let every test, failure and rebuild teach me something. Every machine that finally works is paid for by the ones that did not.</p>

<section id="about"><div class="wrap"><div class="eyebrow">My story</div><h2 class="t rv">Where it began, and what it cost</h2>
<div class="two rv"><div><p>My journey began in 2017 with a question that would not leave me alone: could a robot stand beside a person on the worst day of their life? The Helping Robot I built, designed to guide people to safety and call for help, was only a demonstration, yet it taught me that engineering is most meaningful when it protects people.</p>
<p>Since then I have learned that building is mostly persistence. Chassis flex, sensors misread, motors stall, and a design that looked flawless on screen can fail on its first run. I now return to the bench the next morning.</p>
<p>On the Merch Rover project I carried that mindset into a team working under real pressure. Finishing 1st in Asia and 3rd globally was proof that discipline, trust and endurance build winning machines far more reliably than talent alone.</p></div>
<div class="quote"><i>“</i><h3>Every failure is a measurement, not a verdict.</h3><small>MIRAZ AL HYDER</small></div></div></div></section>
<section id="projects" class="dk sec"><div class="wrap"><div class="eyebrow">Selected work</div><h2 class="t rv">Machines I have built</h2><p class="sub rv">Every project began as a fragile idea on paper. The photographs show the real hands, wires and late hours behind each one.</p><div class="grid" id="g-projects"></div></div></section>
<section id="cad"><div class="wrap"><div class="eyebrow">On the screen first</div><h2 class="t rv">CAD designs from Fusion</h2><p class="sub rv">A robot is first built in my head, then on a screen. These models show the thinking that happens before anything is cut or welded.</p><div class="grid" id="g-cad"></div></div></section>
<section id="awards" class="dk sec"><div class="wrap"><div class="eyebrow">Proving ground</div><h2 class="t rv">Competitions and awards</h2><p class="sub rv">Every start line was an honest test of my work. Some results made me proud, and every one made me better.</p><div class="grid" id="g-awards"></div></div></section>
<section id="experience"><div class="wrap"><div class="eyebrow">Responsibility</div><h2 class="t rv">Judging and discipline</h2><p class="sub rv">Roles that taught me to lead, to listen, and to hold myself to a higher standard than anyone else would.</p><div class="grid" id="g-experience"></div></div></section>
<section id="volunteering" class="gr"><div class="wrap"><div class="eyebrow">Giving back</div><h2 class="t rv">Community and volunteering</h2><p class="sub rv">Skill means little if it serves only the person who owns it. These are the places where I tried to be useful.</p><div class="grid" id="g-volunteering"></div></div></section>
<section id="contact" class="dk sec cta"><div class="wrap"><div class="eyebrow">Contact</div><h2 class="t rv" style="margin-top:18px">Reach out if the problem is hard</h2><p class="rv">I am looking for internships and teams where I can keep learning and contribute to real robotics work. I bring patience, a high tolerance for failure and genuine gratitude for the chance to build.</p><div class="btns rv"><a class="btn" href="mailto:mirazalhyder@gmail.com">mirazalhyder@gmail.com <b>→</b></a><a class="btn" data-ext="" href="https://www.linkedin.com/in/miraz-al-hyder-609492351" target="_blank" rel="noopener noreferrer">LinkedIn <b>→</b></a><button class="btn" id="copy" type="button">Copy email <b>→</b></button></div></div></section>

var D={projects:[
{id:"p1",f:1,t:"Merch Rover: Mechanical Subsystem",m:"Mechanical Subsystem Engineer, July 2025 to present",d:"From the first CAD sketch to the final bolt, I helped shape the rover’s mechanical subsystem. The deadlines were unforgiving and the technical problems were complex, yet our team held together. Placing 1st in Asia and 3rd globally remains the proudest moment of my journey so far.",g:["CAD","Fabrication","Structural troubleshooting"]},
{id:"p2",t:"Autonomous Line-Following Robot",d:"A robot that reads the floor and refuses to lose the line. I engineered the custom chassis, integrated IR sensors, DC motors and a motor controller, and tuned the system until its motion was smooth and decisive. It showed me how a tiny sensor error becomes a large mistake on the track.",g:["IR sensors","Embedded control","Hardware design"]},
{id:"p3",t:"Smart Soccer-Playing Robot",d:"A remote-controlled SoccerBot built around a microcontroller, motor driver and battery system inside a custom frame. Making it fast, stable and responsive meant balancing power, weight and control, and that balance is the part of engineering I enjoy most.",g:["Microcontroller","Motor driver","System integration"]},
{id:"p4",t:"Helping Robot Model",m:"July 2017 to March 2018",d:"My first serious idea: a machine that stays calm when people cannot. It moves, communicates, gathers information online, guides people to safety and calls for help. Its purpose was simple and deeply personal: to help save lives.",g:["Robotics","IoT"]},
{id:"p5",t:"Auto Energy Generation System",m:"January to March 2018",d:"Every footstep and passing vehicle carries energy that is usually wasted. This prototype converts that pressure into electricity to power lights, charge batteries and run small machines, proof that a clean idea can begin with something very simple.",g:["Clean energy","Prototype"]}],
cad:[
{id:"c1",t:"Merch Rover subsystem",m:"Designed in Fusion",d:"The mechanical subsystem as a CAD model, resolved on screen before any part was cut.",g:["Fusion","CAD"]},
{id:"c2",t:"SoccerBot frame",m:"Designed in Fusion",d:"The custom frame that carries the motors, driver and battery.",g:["Fusion","Frame design"]},
{id:"c3",t:"Line-following chassis",m:"Designed in Fusion",d:"A compact chassis shaped for stable, uninterrupted tracking.",g:["Fusion","Chassis"]}],
